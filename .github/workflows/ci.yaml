name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/mihomo-policy validate --policy policy/policy.yaml --cases tests/routing-cases.yaml
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: bin/mihomo-policy-linux-*
